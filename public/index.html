<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vibe Interiors · Projects</title>
<style>
  @font-face { font-family: 'Geist'; src: url(fonts/geist.woff2) format('woff2'); font-weight: 100 900; font-display: swap; }
  @font-face { font-family: 'Geist Mono'; src: url(fonts/geist-mono.woff2) format('woff2'); font-weight: 100 900; font-display: swap; }
  :root { --bg: #f4f5f7; --surface: #fff; --ink: #1c2330; --muted: #667085; --line: #dfe3ea; --line-soft: #e8ebf0; --line-strong: #c9ced8; --accent: #b5532a;
          --ease: cubic-bezier(.2,.7,.2,1);
          --sans: 'Geist', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; --mono: 'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100dvh; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
  main { max-width: 1120px; margin: 0 auto; padding: clamp(28px, 6vw, 72px) 20px 64px; }
  h1 { margin: 0 0 6px; font-size: clamp(26px, 4vw, 34px); font-weight: 600; letter-spacing: -.025em; line-height: 1.1; text-wrap: balance; }
  .sub { margin: 0 0 32px; max-width: 52ch; color: var(--muted); text-wrap: pretty; }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 16px; align-items: start; }
  a.card { display: block; color: inherit; text-decoration: none; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
           transition: border-color .18s var(--ease), box-shadow .18s var(--ease), transform .18s var(--ease); }
  a.card:hover { border-color: var(--line-strong); box-shadow: 0 6px 20px rgba(28,35,48,.08); transform: translateY(-1px); }
  a.card:active { transform: scale(.995); box-shadow: none; }
  a.card:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .thumb { aspect-ratio: 16 / 10; background: var(--line-soft); display: flex; align-items: center; justify-content: center; border-bottom: 1px solid var(--line-soft); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb .none { font: 12px var(--mono); color: var(--muted); letter-spacing: .02em; }
  .info { padding: 14px 16px 16px; }
  .info h2 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
  .info p { margin: 4px 0 0; color: var(--muted); font-size: 13px; text-wrap: pretty; }
  .info .meta { margin-top: 10px; font: 12px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
  .skel .thumb { animation: pulse 1.4s ease-in-out infinite; }
  .skel .line { height: 12px; border-radius: 4px; background: var(--line-soft); margin-top: 8px; animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .55; } }
  .msg { color: var(--muted); max-width: 60ch; }
  .lang { display: flex; gap: 4px; justify-content: flex-end; margin: -24px 0 12px; }
  .lang button { font: 12px var(--mono); padding: 3px 8px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); border-radius: 6px; cursor: pointer; transition: background-color .15s var(--ease), border-color .15s var(--ease); }
  .lang button:hover { background: #f1f3f6; border-color: var(--muted); }
  .lang button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .lang button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  code { font: 12px var(--mono); background: var(--line-soft); padding: 1px 5px; border-radius: 4px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<main>
  <div class="lang" role="group" data-i18n-aria="lang.label"><button data-lang="en">EN</button><button data-lang="it">IT</button></div>
  <h1 data-i18n="list.h1">Projects</h1>
  <p class="sub" data-i18n="list.sub">Pick a model to open. The address of each project can be bookmarked.</p>
  <div id="grid" aria-live="polite">
    <div class="card skel" aria-hidden="true"><div class="thumb"></div><div class="info"><div class="line" style="width:55%"></div><div class="line" style="width:35%"></div></div></div>
  </div>
</main>
<script type="module">
import { t, applyI18n, locale } from './i18n.mjs';
applyI18n(); document.title = t('list.title');
(async () => {
  const grid = document.getElementById('grid');
  let list = null;
  try { list = await (await fetch('projects.json', { cache: 'no-store' })).json(); }
  catch (e) { console.error('projects.json load failed:', e); }
  grid.innerHTML = '';
  if (!list) { grid.innerHTML = `<p class="msg">${t('list.loadError')}</p>`; return; }
  if (!list.length) { grid.innerHTML = `<p class="msg">${t('list.empty')}</p>`; return; }
  const none = () => { const n = document.createElement('span'); n.className = 'none'; n.textContent = t('list.noPreview'); return n; };
  for (const p of list) {
    const a = document.createElement('a');
    a.className = 'card'; a.href = p.id + '/';                    // relative: works under any subpath
    const th = document.createElement('div'); th.className = 'thumb';
    if (p.thumb) { const img = new Image(); img.src = p.id + '/thumb.jpg'; img.alt = t('list.preview', { title: p.title }); img.loading = 'lazy'; img.onerror = () => { img.remove(); th.append(none()); }; th.append(img); }
    else th.append(none());
    const info = document.createElement('div'); info.className = 'info';
    const h = document.createElement('h2'); h.textContent = p.title; info.append(h);
    if (p.description) { const d = document.createElement('p'); d.textContent = p.description; info.append(d); }
    if (p.items != null) { const m = document.createElement('div'); m.className = 'meta'; m.textContent = t('list.objects', { n: p.items.toLocaleString(locale()) }); info.append(m); }
    a.append(th, info); grid.append(a);
  }
})();
</script>
</body>
</html>
