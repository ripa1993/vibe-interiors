<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SKP Watch · Progetti</title>
<style>
  html, body { margin: 0; min-height: 100%; background: #f4f5f7; color: #22252b; font: 14px -apple-system, system-ui, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 32px 16px 48px; }
  h1 { margin: 0 0 4px; font-size: 24px; }
  .sub { margin: 0 0 24px; color: #6a7080; }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
  a.card { display: block; color: inherit; text-decoration: none; background: #fff; border: 1px solid #d5d8de; border-radius: 10px; overflow: hidden;
           transition: box-shadow .12s, transform .12s; }
  a.card:hover, a.card:focus-visible { box-shadow: 0 4px 14px rgba(0,0,0,.12); transform: translateY(-2px); outline: none; }
  .thumb { aspect-ratio: 16 / 10; background: linear-gradient(135deg, #e3e6ec, #cdd2dc); display: flex; align-items: center; justify-content: center;
           font-size: 56px; font-weight: 700; color: #fff; text-transform: uppercase; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .info { padding: 10px 12px 12px; }
  .info h2 { margin: 0 0 2px; font-size: 16px; }
  .info p { margin: 0; color: #6a7080; font-size: 12px; }
  .empty { color: #6a7080; }
</style>
</head>
<body>
<main>
  <h1>Progetti</h1>
  <p class="sub">Scegli un modello da aprire.</p>
  <div id="grid"></div>
</main>
<script>
(async () => {
  const grid = document.getElementById('grid');
  let list = [];
  try { list = await (await fetch('projects.json', { cache: 'no-store' })).json(); }
  catch (e) { console.error('projects.json load failed:', e); }
  if (!list.length) { grid.innerHTML = '<p class="empty">Nessun progetto trovato: crea <code>projects/&lt;nome&gt;/scene.json</code>.</p>'; return; }
  for (const p of list) {
    const a = document.createElement('a');
    a.className = 'card'; a.href = p.id + '/';                    // relative: works under any subpath
    const t = document.createElement('div'); t.className = 'thumb';
    if (p.thumb) { const img = new Image(); img.src = p.id + '/thumb.jpg'; img.alt = ''; img.loading = 'lazy'; img.onerror = () => { img.remove(); t.textContent = p.title[0]; }; t.append(img); }
    else t.textContent = p.title[0];
    const info = document.createElement('div'); info.className = 'info';
    const h = document.createElement('h2'); h.textContent = p.title;
    const d = document.createElement('p'); d.textContent = [p.description, p.items != null ? p.items + ' oggetti' : ''].filter(Boolean).join(' · ');
    info.append(h, d); a.append(t, info); grid.append(a);
  }
})();
</script>
</body>
</html>
