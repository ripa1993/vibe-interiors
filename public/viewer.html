<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SKP Watch</title>
<style>
  @font-face { font-family: 'Geist'; src: url(../fonts/geist.woff2) format('woff2'); font-weight: 100 900; font-display: swap; }
  @font-face { font-family: 'Geist Mono'; src: url(../fonts/geist-mono.woff2) format('woff2'); font-weight: 100 900; font-display: swap; }
  :root { --bg: #f4f5f7; --surface: #fff; --ink: #1c2330; --muted: #667085; --line: #dfe3ea; --line-soft: #e8ebf0; --line-strong: #c9ced8;
          --accent: #b5532a; --accent-ink: #8c3f1d; --shadow: 0 8px 24px rgba(28,35,48,.10); --ease: cubic-bezier(.2,.7,.2,1);
          --sans: 'Geist', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; --mono: 'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 13px/1.4 var(--sans); -webkit-font-smoothing: antialiased; }
  #view { position: fixed; inset: 0; }
  #rtgpu { position: absolute; inset: 0; width: 100%; height: 100%; display: none; pointer-events: none; }   /* WebGPU path tracer canvas, on top of the WebGL one */
  #bar { position: fixed; top: 10px; left: 10px; display: flex; gap: 8px; align-items: center;
         background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
  #bar { z-index: 5; }
  #home { color: var(--ink); text-decoration: none; font-weight: 500; white-space: nowrap; padding: 3px 8px 3px 2px; margin-right: 2px; border-right: 1px solid var(--line); transition: color .15s var(--ease); }
  #home:hover { color: var(--accent); }
  #dot { width: 9px; height: 9px; border-radius: 50%; background: var(--line-strong); }
  #dot.live { background: #3c9a5f; }
  #dot.flash { background: #c98a1b; }
  #camctl { position: relative; display: inline-block; }
  #views { display: none; position: absolute; top: calc(100% + 11px); left: -6px; z-index: 6; flex-direction: column; gap: 4px; min-width: 120px;
           background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px; box-shadow: 0 4px 14px rgba(28,35,48,.12); }   /* camera presets: a dropdown under #camBtn, outside the bar, shown while #bar.cam */
  #views button { text-align: left; }
  #bar.cam #views { display: flex; }
  #camBtn { display: inline-flex; align-items: center; padding: 3px 7px; }
  #camBtn svg { width: 18px; height: 18px; display: block; }
  #bar.cam #camBtn { background: var(--accent); border-color: var(--accent); color: #fff; }
  #actions { display: flex; gap: 4px; align-items: center; }                 /* Render | PNG | Notte | Prima persona, close together */
  #setctl { position: relative; display: inline-block; margin-left: -4px; }                 /* right next to the camera button */
  #setBtn { display: inline-flex; align-items: center; padding: 3px 7px; }
  #setBtn svg { width: 18px; height: 18px; display: block; }
  #bar.set #setBtn { background: var(--accent); border-color: var(--accent); color: #fff; }
  #setmenu { display: none; position: absolute; top: calc(100% + 11px); left: -6px; z-index: 6; flex-direction: column; gap: 4px; min-width: 130px;
             background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px; box-shadow: 0 4px 14px rgba(28,35,48,.12); }   /* settings (Dims, unit, Misura clic): a dropdown under the gear; stays open while toggling, folds on a click elsewhere */
  #setmenu button { text-align: left; }
  #bar.set #setmenu { display: flex; }
  button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  #aobtn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  #rtbtn.active, #dnbtn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  #dnbtn { display: none; } #rtbtn.active ~ #dnbtn { display: inline-block; }
  #nightbtn.active { background: var(--ink); border-color: var(--ink); color: #fff; }
  #fpbtn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  #fphint { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); display: none; z-index: 5; pointer-events: none;
            background: rgba(28,35,48,.9); color: #fff; border-radius: 6px; padding: 6px 12px; font-size: 12px; }
  body.fp #fphint { display: block; } body.fp #view { cursor: pointer; } body.look #view { cursor: none; }
  #views button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  #gbtn { display: none; position: fixed; left: 10px; bottom: 10px; z-index: 5; box-shadow: 0 1px 4px rgba(28,35,48,.10); }   /* bottom-left, the panel opens right above it */
  #gbtn.has { display: inline-block; }
  #gbtn.open:not(.on) { border-color: var(--accent); color: var(--accent); }       /* panel open, no group on: blue; groups on: orange (button.on) */
  #groups { position: fixed; left: 10px; bottom: 48px; z-index: 5; display: none; max-height: 62vh; overflow: auto; width: min(380px, calc(100vw - 20px)); box-sizing: border-box;
            background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  #groups.open { display: block; }
  #groups h4 { margin: 8px 0 3px; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  #groups h4:first-child { margin-top: 0; }
  #groups h4.cat { display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
  #groups h4.cat:hover { color: var(--accent); }
  #groups h4.cat .chev { display: inline-block; width: 10px; transition: transform .12s; font-size: 14px; line-height: 1; }
  #groups h4.cat.open .chev { transform: rotate(90deg); }
  #groups h4.cat .cnt { margin-left: auto; font-weight: 400; letter-spacing: 0; text-transform: none; color: var(--accent); }
  #groups label { display: flex; gap: 6px; align-items: flex-start; padding: 2px 0; cursor: pointer; line-height: 1.3; }   /* long labels wrap under the text, not under the checkbox */
  #groups label input { flex: none; margin: 2px 0 0; }
  #groups .acts { display: flex; gap: 6px; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line-soft); }
  #labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .dim { position: absolute; transform: translate(-50%, -50%); background: #fff; color: var(--accent-ink); font: 600 12px var(--mono); font-variant-numeric: tabular-nums; border: 1px solid var(--accent);
         border-radius: 4px; padding: 1px 5px; font-weight: 600; white-space: nowrap; }
  #tip { position: fixed; font-variant-numeric: tabular-nums; display: none; pointer-events: none; background: rgba(28,35,48,.94); color: #fff;
         border-radius: 6px; padding: 5px 8px; font-size: 12px; line-height: 1.35; }
  button { font: inherit; border: 1px solid var(--line-strong); background: #fff; border-radius: 6px; padding: 3px 8px; cursor: pointer; }
  button { touch-action: manipulation; white-space: nowrap; font-weight: 500; color: var(--ink); transition: background-color .15s var(--ease), border-color .15s var(--ease), color .15s var(--ease), transform .12s var(--ease); }
  button:not(.on):not(.active):hover { background: #f1f3f6; border-color: var(--muted); }
  button:active { transform: scale(.97); }
  button:focus-visible, #home:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.on, button.active { color: #fff; }
  #status { font-variant-numeric: tabular-nums; color: var(--muted); }
  #morebtn { display: none; }
  /* phones / touch screens: one compact row of main actions; views, zoom and dimensions fold behind the "Views" button */
  @media (max-width: 820px), (pointer: coarse) and (max-width: 1100px) {
    #bar { top: max(6px, env(safe-area-inset-top)); left: 6px; right: 6px; flex-wrap: wrap; gap: 6px; padding: 6px; }
    #bar button { min-height: 38px; min-width: 38px; padding: 6px 11px; font-size: 14px; }
    #status { display: none; }
    #rtctl, #fpctl { display: none; }                           /* Render and first person need a GPU / keyboard: desktop only (AO too, see #setmenu #aobtn below) */
    #home { order: 0; }
    #dot { order: 0; margin: 0 2px; }
    #nightctl { order: 1; }
    #actions, #setctl, #setmenu { display: contents; }
    #setctl { margin: 0; padding: 0; border: 0; }
    #setBtn { display: none; }                                  /* on phones Dims / unit / Misura clic are rows of the Views menu */
    #setmenu button { text-align: center; }
    #gbtn { left: 6px; bottom: max(6px, env(safe-area-inset-bottom)); min-height: 38px; padding: 6px 11px; font-size: 14px; }
    #morebtn { display: inline-block; order: 2; margin-left: auto; }
    #bar.open #morebtn { background: var(--accent); border-color: var(--accent); color: #fff; }
    #camBtn { display: none; }                                  /* on phones the presets live in the Views menu, as a row inside the bar */
    #camctl { display: contents; }
    #views { position: static; flex-direction: row; background: none; border: 0; padding: 0; box-shadow: none; min-width: 0; }
    #views button { text-align: center; }
    #views, #setmenu button, #snap { display: none; }
    #bar.open #views { display: flex; order: 3; flex: 1 1 100%; gap: 6px; }
    #bar.open #setmenu button, #bar.open #snap { display: inline-block; order: 4; }
    #bar.open #setmenu #aobtn { display: none; }
    #groups { left: 6px; right: 6px; bottom: calc(max(6px, env(safe-area-inset-bottom)) + 44px); max-height: 60vh; width: auto; }
    #groups label { padding: 7px 0; font-size: 14px; }
    #fphint { max-width: calc(100vw - 24px); bottom: max(12px, env(safe-area-inset-bottom)); }
  }
</style>
</head>

<div id="bar"><a id="home" href="../" title="Elenco dei progetti">← Progetti</a><span id="dot"></span><span id="status">connecting…</span><button id="morebtn" title="Views, dimensions">Views ▾</button>
  <span id="camctl"><button id="camBtn" title="Viste camera (1-9)" aria-label="Viste camera" aria-haspopup="true" aria-expanded="false"><svg viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M208,56H180.28L166.65,35.56A8,8,0,0,0,160,32H96a8,8,0,0,0-6.65,3.56L75.71,56H48A24,24,0,0,0,24,80V192a24,24,0,0,0,24,24H208a24,24,0,0,0,24-24V80A24,24,0,0,0,208,56Zm8,136a8,8,0,0,1-8,8H48a8,8,0,0,1-8-8V80a8,8,0,0,1,8-8H80a8,8,0,0,0,6.66-3.56L100.28,48h55.43l13.63,20.44A8,8,0,0,0,176,72h32a8,8,0,0,1,8,8ZM128,88a44,44,0,1,0,44,44A44.05,44.05,0,0,0,128,88Zm0,72a28,28,0,1,1,28-28A28,28,0,0,1,128,160Z"/></svg></button>

  <span id="actions">

<script type="importmap">
{ "imports": { "three": "../three/build/three.module.js", "three/addons/": "../three/examples/jsm/", "three/examples/jsm/": "../three/examples/jsm/",
  "three/webgpu": "../three/build/three.webgpu.js", "three/tsl": "../three/build/three.tsl.js",
  "three-mesh-bvh": "../vendor/three-mesh-bvh/src/index.js", "three-mesh-bvh/webgpu": "../vendor/three-mesh-bvh/src/webgpu/index.js",
  "three-gpu-pathtracer": "../vendor/three-gpu-pathtracer/src/index.js", "three-gpu-pathtracer/webgpu": "../vendor/three-gpu-pathtracer/src/webgpu/index.js",
  "oidn-web": "../vendor/oidn-web/dist/oidn.js", "@pmndrs/upscaler": "../vendor/@pmndrs/upscaler/dist/index.js" } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const view = document.getElementById('view');
const dot = document.getElementById('dot');
const status = document.getElementById('status');

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.shadowMap.enabled = true;
view.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf4f5f7);
THREE.Object3D.DEFAULT_UP.set(0, 0, 1);              // SketchUp is Z-up

const camera = new THREE.PerspectiveCamera(35, 1, 1, 5000);
camera.up.set(0, 0, 1);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

const hemi = new THREE.HemisphereLight(0xffffff, 0xb4b8c0, 2.4);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(-200, -150, 400);
sun.castShadow = true;
sun.shadow.bias = -0.0005;
sun.shadow.normalBias = 0.6;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -300, right: 300, top: 300, bottom: -300, near: 1, far: 1500 });
scene.add(sun);

const model = new THREE.Group();
scene.add(model);
let current = null;                                    // last loaded scene JSON
let firstLoad = true;

function resize() {
  const w = view.clientWidth, h = view.clientHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  window.aoResize?.(w, h);                              // composer of the AO button (defined later)
  window.rtwResize?.(w, h);                             // WebGPU path tracer canvas
}
addEventListener('resize', resize);
resize();

const textureLoader = new THREE.TextureLoader();
const FACE_INDEX = { '+x': 0, '-x': 1, '+y': 2, '-y': 3, '+z': 4, '-z': 5 };   // BoxGeometry material slots
function texturedBoxMaterials(item) {                    // item.tex = {url, tile, face}: one textured face (tiles of `tile` inches), the rest plain
  const { url, tile, face = '-y' } = item.tex;
  const [x0, y0, z0, x1, y1, z1] = item.box;
  const dims = { x: x1 - x0, y: y1 - y0, z: z1 - z0 };
  const axes = { '-y': ['x', 'z'], '+y': ['x', 'z'], '-x': ['y', 'z'], '+x': ['y', 'z'], '-z': ['x', 'y'], '+z': ['x', 'y'] }[face];
  const tex = textureLoader.load(url);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(dims[axes[0]] / tile, dims[axes[1]] / tile);
  const mats = Array.from({ length: 6 }, () => materialFor(item.c));
  mats[FACE_INDEX[face]] = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.85, metalness: 0.0 });
  return mats;
}

function texturedSlabMaterials(item) {                   // item.tex = {url, tile} on a slab: the top/bottom caps use world x,y as UV (tiles of `tile` inches), the sides stay plain
  const tex = textureLoader.load(item.tex.url);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.anisotropy = 8;
  tex.repeat.set(1 / item.tex.tile, 1 / item.tex.tile);
  return [new THREE.MeshStandardMaterial({ map: tex, roughness: 0.6, metalness: 0.0 }), materialFor(item.c)];   // ExtrudeGeometry groups: 0 = caps, 1 = sides
}

const emissiveMats = [];                                 // items with "em": glow in night mode
function materialFor(c) {
  const [r, g, b, a = 255] = c || [200, 200, 200, 255];
  return new THREE.MeshStandardMaterial({
    color: new THREE.Color(r / 255, g / 255, b / 255).convertSRGBToLinear(),
    roughness: 0.85, metalness: 0.0, side: THREE.DoubleSide,
    transparent: a < 255, opacity: a / 255,
  });
}

function tubeGeometry({ p, r, n }) {                     // circular section along a path, parallel-transported frames, smooth normals
  const P = p.map(a => new THREE.Vector3(...a)), k = P.length;
  const T = P.map((_, i) => P[Math.min(i + 1, k - 1)].clone().sub(P[Math.max(i - 1, 0)]).normalize());
  const helper = Math.abs(T[0].x) < 0.9 ? new THREE.Vector3(1, 0, 0) : new THREE.Vector3(0, 1, 0);
  let e1 = new THREE.Vector3().crossVectors(T[0], helper).normalize();
  const pos = [], nor = [], idx = [], ringStart = [];
  for (let i = 0; i < k; i++) {
    e1 = e1.clone().sub(T[i].clone().multiplyScalar(e1.dot(T[i]))).normalize();
    const e2 = new THREE.Vector3().crossVectors(T[i], e1);
    ringStart.push(pos.length / 3);
    for (let j = 0; j < n; j++) {
      const a = 2 * Math.PI * j / n, d = e1.clone().multiplyScalar(Math.cos(a)).add(e2.clone().multiplyScalar(Math.sin(a)));
      pos.push(P[i].x + r[i] * d.x, P[i].y + r[i] * d.y, P[i].z + r[i] * d.z);
      nor.push(d.x, d.y, d.z);
    }
  }
  for (let i = 0; i < k - 1; i++) for (let j = 0; j < n; j++) {
    const a = ringStart[i] + j, b = ringStart[i] + (j + 1) % n, c = ringStart[i + 1] + (j + 1) % n, d = ringStart[i + 1] + j;
    idx.push(a, b, c, a, c, d);
  }
  const cap = (i, sign) => {                              // flat end cap with its own vertices (crisp edge)
    const base = pos.length / 3;
    pos.push(P[i].x, P[i].y, P[i].z); nor.push(T[i].x * sign, T[i].y * sign, T[i].z * sign);
    for (let j = 0; j < n; j++) {
      const s = ringStart[i] + j;
      pos.push(pos[3 * s], pos[3 * s + 1], pos[3 * s + 2]); nor.push(T[i].x * sign, T[i].y * sign, T[i].z * sign);
    }
    for (let j = 0; j < n; j++) {
      const a = base + 1 + j, b = base + 1 + (j + 1) % n;
      if (sign > 0) idx.push(base, a, b); else idx.push(base, b, a);
    }
  };
  cap(0, -1); cap(k - 1, 1);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  g.setIndex(idx);
  return g;
}

function roundedRectPts(x0, y0, x1, y1, r, seg = 4) {    // CCW outline, same construction as the SketchUp side
  const pts = [];
  for (const [cx, cy, a0] of [[x1 - r, y0 + r, -90], [x1 - r, y1 - r, 0], [x0 + r, y1 - r, 90], [x0 + r, y0 + r, 180]])
    for (let k = 0; k <= seg; k++) {
      const a = (a0 + 90 * k / seg) * Math.PI / 180;
      pts.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]);
    }
  return pts;
}

function slabGeometry({ o, h, z }) {                     // flat slab with holes, extruded along +Z
  const shape = new THREE.Shape(o.map(p => new THREE.Vector2(p[0], p[1])));
  shape.holes = h.map(hole => new THREE.Path(hole.map(p => new THREE.Vector2(p[0], p[1]))));
  const g = new THREE.ExtrudeGeometry(shape, { depth: z[1] - z[0], bevelEnabled: false, curveSegments: 1 });
  g.translate(0, 0, z[0]);
  return g;
}

function trayGeometry({ o, z }) {                        // open-top tray: smooth inward walls + flat floor
  const m = o.length, pos = [], nor = [], idx = [];
  const inward = i => {                                  // inward normal of edge i -> i+1 (outline is CCW)
    const a = o[i], b = o[(i + 1) % m], dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1;
    return [-dy / l, dx / l];
  };
  for (const zz of z) for (let i = 0; i < m; i++) {
    const n1 = inward((i + m - 1) % m), n2 = inward(i);
    let nx = n1[0] + n2[0], ny = n1[1] + n2[1]; const l = Math.hypot(nx, ny) || 1;
    pos.push(o[i][0], o[i][1], zz); nor.push(nx / l, ny / l, 0);
  }
  for (let i = 0; i < m; i++) { const j = (i + 1) % m; idx.push(i, j, m + j, i, m + j, m + i); }
  const base = pos.length / 3;
  for (let i = 0; i < m; i++) { pos.push(o[i][0], o[i][1], z[0]); nor.push(0, 0, 1); }
  for (let i = 1; i < m - 1; i++) idx.push(base, base + i, base + i + 1);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  g.setIndex(idx);
  return g;
}

function rboxGeometry({ b, r, top, bot = 0 }) {          // rounded box: filleted top edge, optional filleted bottom edge (retro appliance look)
  const [x0, y0, z0, x1, y1, z1] = b;
  const rings = [];
  if (bot > 0) {
    for (const deg of [90, 75, 60, 45, 30, 15]) {
      const t = deg * Math.PI / 180;
      rings.push([bot * (1 - Math.cos(t)), z0 + bot - bot * Math.sin(t)]);
    }
    rings.push([0, z0 + bot]);
  } else rings.push([0, z0]);
  rings.push([0, z1 - top]);
  for (const deg of [15, 30, 45, 60, 75, 90]) {
    const t = deg * Math.PI / 180;
    rings.push([top * (1 - Math.cos(t)), z1 - top + top * Math.sin(t)]);
  }
  const pts = rings.map(([ins, zz]) => roundedRectPts(x0 + ins, y0 + ins, x1 - ins, y1 - ins, Math.max(r - ins, 0.05)).map(p => [p[0], p[1], zz]));
  const m = pts[0].length, pos = [], idx = [];
  pts.forEach(ring => ring.forEach(p => pos.push(...p)));
  for (let i = 0; i < pts.length - 1; i++) for (let j = 0; j < m; j++) {
    const j2 = (j + 1) % m, b0 = i * m + j, b1 = i * m + j2, t0 = (i + 1) * m + j, t1 = (i + 1) * m + j2;
    idx.push(b0, b1, t1, b0, t1, t0);
  }
  const cap = (ring, flip) => {                          // flat caps get their own vertices -> crisp edge
    const base = pos.length / 3;
    ring.forEach(p => pos.push(...p));
    for (let i = 1; i < m - 1; i++) flip ? idx.push(base, base + i + 1, base + i) : idx.push(base, base + i, base + i + 1);
  };
  cap(pts[0], true); cap(pts[pts.length - 1], false);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

function geometryFor(item) {
  if (item.tube) return tubeGeometry(item.tube);
  if (item.slab) return slabGeometry(item.slab);
  if (item.tray) return trayGeometry(item.tray);
  if (item.rbox) return rboxGeometry(item.rbox);
  if (item.box) {
    const [x0, y0, z0, x1, y1, z1] = item.box;
    const g = new THREE.BoxGeometry(x1 - x0, y1 - y0, z1 - z0);
    g.translate((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
    return g;
  }
  const pos = [];
  for (const f of item.faces) {
    if (Array.isArray(f)) {                             // plain convex face: fan triangulation
      for (let i = 1; i < f.length - 1; i++) pos.push(...f[0], ...f[i], ...f[i + 1]);
    } else {                                            // face with holes: project to 2D and triangulate
      const pts = [...f.v, ...f.h.flat()];
      let nx = 0, ny = 0, nz = 0;                       // Newell normal of the outer loop picks the projection plane
      for (let i = 0; i < f.v.length; i++) {
        const a = f.v[i], b = f.v[(i + 1) % f.v.length];
        nx += (a[1] - b[1]) * (a[2] + b[2]); ny += (a[2] - b[2]) * (a[0] + b[0]); nz += (a[0] - b[0]) * (a[1] + b[1]);
      }
      const drop = Math.abs(nx) > Math.abs(ny) && Math.abs(nx) > Math.abs(nz) ? 0 : Math.abs(ny) > Math.abs(nz) ? 1 : 2;
      const to2 = p => new THREE.Vector2(...[0, 1, 2].filter(k => k !== drop).map(k => p[k]));
      const contour = f.v.map(to2), holes = f.h.map(h => h.map(to2));
      for (const [a, b, c] of THREE.ShapeUtils.triangulateShape(contour, holes)) pos.push(...pts[a], ...pts[b], ...pts[c]);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.computeVertexNormals();
  return g;
}

// groups: items may carry "g" (an id or a list of ids); an item with groups is drawn only when one of them is enabled. Items without "g" are always drawn.
// Enabled groups live in the URL (?g=id1,id2); off by default unless the group has "on": true (applied on first load when ?g is absent).
const enabledGroups = new Set((new URLSearchParams(location.search).get('g') || '').split(',').filter(Boolean));

let groupDefs = [];                                               // [{ id, label, cat, variant }]
const REMOVED_ID = 'rimossi';
function normalizeRemoved(data) {                                 // items named "...Rimosso..." (walls to be demolished) with no "g" join the implicit group "Elementi rimossi": off by default, left out of "Accendi tutto"
  let any = false;

  if (any && !(data.groups || []).some(g => g.id === REMOVED_ID)) (data.groups = data.groups || []).push({ id: REMOVED_ID, label: 'Elementi rimossi', cat: 'Demolizioni', skipAll: true });

function addCollider(item) {                                      // only what can block a standing person: z between ~8" and ~62"

function build(data) {

function applyCamera(cam) {
  camera.fov = cam.fov;
  camera.position.set(...cam.eye);
  controls.target.set(...cam.target);
  camera.up.set(0, 0, 1);                               // always upright; the file's roll would fight OrbitControls
  camera.updateProjectionMatrix();
  controls.update();
}

async function load() {
  try {
    const res = await fetch('scene.json?t=' + Date.now(), { cache: 'no-store' });
    const data = await res.json();
    normalizeRemoved(data);
    if (!groupsInit) { groupsInit = true; if (!new URLSearchParams(location.search).has('g')) for (const g of data.groups || []) if (g.on) enabledGroups.add(g.id); }   // default-on groups ("on": true in scene.json) only when the URL has no ?g
    current = data;
    build(data);
    if (firstLoad) { firstLoad = false; applyInitialView(data); if (new URLSearchParams(location.search).has('fp')) enterFP(); if (new URLSearchParams(location.search).has('rt')) rtOn(); if (new URLSearchParams(location.search).has('ao')) aoOn(); }   // later reloads keep your orbit
    status.textContent = `${data.items.length} objects · ${new Date().toLocaleTimeString()}`;
  } catch (e) {
    console.error('scene load failed:', e);

}


// ---- night mode (key N, ?night=1): daylight off, the "lights" of scene.json on (spot lights, optional shadows), items with "em" glow ----
// lights: [{ t:'spot', p:[x,y,z], d:[dx,dy,dz] (aim, default down), a: half-angle deg, pen: penumbra 0..1, c:[r,g,b], i: intensity, r: range (0 = unlimited), sh: 1 = casts shadows, g: group id }]

const lightsGroup = new THREE.Group();

    const d = new THREE.Vector3(...(L.d || [0, 0, -1])).normalize();

function applyNight() {

  hemi.color.set(night ? 0x7a8cb8 : 0xffffff); hemi.groundColor.set(night ? 0x1c202a : 0xb4b8c0);
  sun.visible = !night;

  lightsGroup.visible = night;

nightBtn.onclick = () => { night = !night; applyNight(); setParams({ night: night ? 1 : null }); };

// ---- AO button (key O, ?ao=1): screen-space ambient occlusion (GTAO) on the raster view: soft contact shadows in corners, under furniture. The path tracer has it built in.
document.getElementById('morebtn').onclick = e => { document.getElementById('bar').classList.toggle('open'); e.currentTarget.textContent = document.getElementById('bar').classList.contains('open') ? 'Views ▴' : 'Views ▾'; };   // phones only
const aoBtn = document.getElementById('aobtn');
const ao = { on: false, composer: null, pass: null };
window.aoResize = (w, h) => ao.composer?.setSize(w, h);
async function aoOn() {
  aoBtn.textContent = 'AO…';
  try {
    if (!ao.composer) {
      const [{ EffectComposer }, { RenderPass }, { GTAOPass }, { OutputPass }] = await Promise.all([
        import('three/addons/postprocessing/EffectComposer.js'), import('three/addons/postprocessing/RenderPass.js'),
        import('three/addons/postprocessing/GTAOPass.js'), import('three/addons/postprocessing/OutputPass.js')]);

      ao.composer = new EffectComposer(renderer, rtg);

  tipEl.style.cssText += `;display:block;left:${ev.clientX + 14}px;top:${ev.clientY + 14}px`;
});
renderer.domElement.addEventListener('pointerleave', () => tipEl.style.display = 'none');
let downAt = null;
renderer.domElement.addEventListener('pointerdown', ev => downAt = [ev.clientX, ev.clientY]);
renderer.domElement.addEventListener('pointerup', ev => {                 // a click, not a drag
  if (!downAt || Math.hypot(ev.clientX - downAt[0], ev.clientY - downAt[1]) > 4) return;
  if (!selDims) return;
  const hit = pick(ev);
  selected = hit && hit.name !== selected ? hit.name : null;
  refreshDims();
});

const _v = new THREE.Vector3();
function placeLabels() {
  const w = view.clientWidth, h = view.clientHeight;
  for (const { el, pos } of labels) {
    _v.copy(pos).project(camera);
    const vis = _v.z < 1 && Math.abs(_v.x) <= 1 && Math.abs(_v.y) <= 1;   // hide labels behind the camera or off-screen
    el.style.display = vis ? 'block' : 'none';
    el.style.left = ((_v.x + 1) / 2) * w + 'px';
    el.style.top = ((1 - _v.y) / 2) * h + 'px';
  }
}

function zoom(factor) {                                  // dolly toward / away from the orbit target
  const off = camera.position.clone().sub(controls.target).multiplyScalar(factor);
  const len = Math.min(Math.max(off.length(), 5), 4000);
  camera.position.copy(controls.target).add(off.setLength(len));
  controls.update();
  saveCam();
}

// ---- first-person walk: WASD / arrows move, Q/E turn, click to look, spawn at scene.json "spawn" ({p:[x,y], yaw: degrees from +X, ccw}) ----
const EYE = 66, RADIUS = 6, fpbtn = document.getElementById('fpbtn');
let fp = null, fpLook = false;                                           // null = orbit mode; else { x, y, yaw, pitch, saved }
function hitsSlab(o, x, y) {                             // circle vs. polygon (inside, or closer than RADIUS to an edge)
  let inside = false;
  for (let i = 0, j = o.length - 1; i < o.length; j = i++) {
    const [xi, yi] = o[i], [xj, yj] = o[j];
    if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) inside = !inside;
    const dx = xj - xi, dy = yj - yi, t = Math.max(0, Math.min(1, ((x - xi) * dx + (y - yi) * dy) / (dx * dx + dy * dy || 1)));
    if (Math.hypot(x - xi - t * dx, y - yi - t * dy) < RADIUS) return true;
  }
  return inside;
}
function blocked(x, y) {
  for (const c of colliders) {
    const b = c.b;
    if (x < b[0] - RADIUS || x > b[2] + RADIUS || y < b[1] - RADIUS || y > b[3] + RADIUS) continue;
    if (c.o) { if (hitsSlab(c.o, x, y)) return true; continue; }
    const dx = Math.max(b[0] - x, 0, x - b[2]), dy = Math.max(b[1] - y, 0, y - b[3]);
    if (dx * dx + dy * dy < RADIUS * RADIUS) return true;
  }
  return false;
}
function fpPlace() {
  const cp = Math.cos(fp.pitch);
  camera.position.set(fp.x, fp.y, EYE);
  camera.lookAt(fp.x + Math.cos(fp.yaw) * cp, fp.y + Math.sin(fp.yaw) * cp, EYE + Math.sin(fp.pitch));
}
function enterFP() {
  if (fp) return;
  const sp = current?.spawn;
  let x, y, yaw;
  if (sp) { [x, y] = sp.p; yaw = (sp.yaw || 0) * Math.PI / 180; }
  else { const { box } = bounds(), c = box.getCenter(new THREE.Vector3()); x = box.min.x + (box.max.x - box.min.x) * 0.15; y = box.min.y + (box.max.y - box.min.y) * 0.15; yaw = Math.atan2(c.y - y, c.x - x); }
  fp = { x, y, yaw, pitch: 0, saved: { pos: camera.position.clone(), target: controls.target.clone(), fov: camera.fov } };
  controls.enabled = false; held.clear();
  camera.fov = 70; camera.updateProjectionMatrix();
  document.body.classList.add('fp'); fpbtn.classList.add('active');
  if (ceilingMesh) { ceilingMesh.visible = true; if (rt.on) rtSetup(); }
  setParams({ fp: 1 }); fpPlace();
}
function exitFP() {
  if (!fp) return;
  const s = fp.saved; window.fpStopLook?.(); fp = null; held.clear();
  controls.enabled = true;
  setCam(s.pos, s.target, s.fov);
  document.body.classList.remove('fp'); fpbtn.classList.remove('active');
  if (ceilingMesh) { ceilingMesh.visible = false; if (rt.on) rtSetup(); }
  setParams({ fp: null });
}
window.fpState = () => fp;                               // debug / tests
fpbtn.onclick = () => fp ? exitFP() : enterFP();
function stepFP(dt) {
  const turn = (held.has('e') ? -1 : 0) + (held.has('q') ? 1 : 0);
  fp.yaw += turn * dt * 1.6;                             // E = turn right (clockwise seen from above), Q = left
  let f = 0, r = 0;
  for (const k of held) { const m = MOVE[k]; if (m && k !== 'e' && k !== 'q') { r += m[0]; f += m[1]; } }
  if (f || r) {
    const sp = dt * (held.has('shift') ? 240 : 80) / Math.hypot(f, r);   // inches per second (80" = 2 m/s)
    const dx = (Math.cos(fp.yaw) * f + Math.sin(fp.yaw) * r) * sp, dy = (Math.sin(fp.yaw) * f - Math.cos(fp.yaw) * r) * sp;
    const stuck = blocked(fp.x, fp.y);                   // already inside something: let the user walk out
    if (stuck || !blocked(fp.x + dx, fp.y)) fp.x += dx;
    if (stuck || !blocked(fp.x, fp.y + dy)) fp.y += dy;
  }
  fpPlace();
}
{ const cv = renderer.domElement;                      // click to start looking around (mouse captured), click again (or Esc) to stop
  const setLook = on => {
    if (!fp) on = false;
    fpLook = on; document.body.classList.toggle('look', on);
    if (on) cv.requestPointerLock?.(); else if (document.pointerLockElement === cv) document.exitPointerLock();
  };
  cv.addEventListener('click', () => { if (fp) setLook(!fpLook); });
  document.addEventListener('pointerlockchange', () => { if (document.pointerLockElement !== cv && fpLook) setLook(false); });
  addEventListener('mousemove', e => {
    if (!fp || !fpLook) return;
    fp.yaw -= e.movementX * 0.003;
    fp.pitch = Math.max(-1.2, Math.min(1.2, fp.pitch - e.movementY * 0.003));
  });
  window.fpStopLook = () => setLook(false);
}
// ---- keyboard fly: WASD / arrows move on the floor plane, Q/E down/up, Shift = faster ----
const MOVE = { w: [0, 1, 0], arrowup: [0, 1, 0], s: [0, -1, 0], arrowdown: [0, -1, 0],
               a: [-1, 0, 0], arrowleft: [-1, 0, 0], d: [1, 0, 0], arrowright: [1, 0, 0], e: [0, 0, 1], q: [0, 0, -1] };
const held = new Set();
let lastT = 0;
function stepMove(now) {
  const dt = Math.min((now - lastT) / 1000, 0.1); lastT = now;
  if (fp) { stepFP(dt); return; }
  if (!held.size) return;
  let r = 0, f = 0, u = 0;
  for (const k of held) { const m = MOVE[k]; r += m[0]; f += m[1]; u += m[2]; }
  const fwd = controls.target.clone().sub(camera.position); fwd.z = 0;
  if (fwd.lengthSq() < 1e-6) { fwd.set(0, 1, 0).applyQuaternion(camera.quaternion); fwd.z = 0; }   // looking straight down: use screen-up
  fwd.normalize();
  const right = new THREE.Vector3(fwd.y, -fwd.x, 0);
  const d = fwd.multiplyScalar(f).add(right.multiplyScalar(r)); d.z = u;
  if (!d.lengthSq()) return;
  d.normalize().multiplyScalar(dt * (held.has('shift') ? 480 : 160));   // inches per second
  camera.position.add(d); controls.target.add(d);
}
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey || /INPUT|TEXTAREA/.test(e.target.tagName)) return;
  const k = e.key.toLowerCase();
  if (k in MOVE) { held.add(k); if (e.shiftKey) held.add('shift'); e.preventDefault(); return; }
});
addEventListener('keyup', e => {
  const k = e.key.toLowerCase();
  held.delete(k); if (!e.shiftKey) held.delete('shift');
  if (k in MOVE && !Object.keys(MOVE).some(x => held.has(x))) { held.clear(); if (!fp) saveCam(); }
});
addEventListener('blur', () => held.clear());
addEventListener('keydown', e => {
  if (e.key === 'o' || e.key === 'O') return aoBtn.click();
  if (e.key === 't' || e.key === 'T') return rtBtn.click();
  if (e.key === 'n' || e.key === 'N') return nightBtn.click();
  if (e.key === 'f' || e.key === 'F') return fpbtn.click();
  if (e.key === 'Escape') return exitFP();
  if (fp && /^[1-9+=_-]$/.test(e.key)) { if (/\d/.test(e.key)) exitFP(); else return; }
  if (e.key === '+' || e.key === '=') return zoom(0.8);
  if (e.key === '-' || e.key === '_') return zoom(1.25);
  if (e.key === 'm' || e.key === 'M') return document.getElementById('dims').click();
  if (e.key === 'k' || e.key === 'K') return document.getElementById('seldims').click();
  if (e.key === 'p' || e.key === 'P') return document.getElementById('snap').click();
  if (e.key === 'u' || e.key === 'U') return document.getElementById('unit').click();
  if (e.key === 'g' || e.key === 'G') return gbtn.click();
  const i = Number(e.key) - 1;
  if (i >= 0 && i < PRESETS.length && !e.metaKey && !e.ctrlKey) runPreset(i);
});

if (!window.STATIC_BUILD) {                              // versione statica (Cloudflare Pages): niente server, niente aggiornamento automatico
  const es = new EventSource('events');
  es.onopen = () => dot.className = 'live';
  es.onerror = () => dot.className = '';
  es.addEventListener('reload', () => {
    dot.className = 'flash'; setTimeout(() => dot.className = 'live', 400);
    load();
  });
}

// ---- PNG export: copies the canvas that is on screen (raster, AO or path tracer) right after it was drawn, so no buttons / labels / tooltip are included ----
let snapReq = false;
function snapshot() {
  const raster = !rtw.on && !rt.on;                                   // dimension lines are scene objects: hide them for the raster / AO image (path tracers don't draw them)
  const gpu = rtw.on && rtw.canvas && rtw.canvas.style.display !== 'none';
  if (raster) { dimGroup.visible = false; if (ao.on && ao.composer) ao.composer.render(); else renderer.render(scene, camera); }
  const src = gpu ? rtw.canvas : renderer.domElement;
  const c = document.createElement('canvas'); c.width = src.width; c.height = src.height;
  c.getContext('2d').drawImage(src, 0, 0);
  dimGroup.visible = true;
  c.toBlob(b => {
    if (!b) return;
    const a = document.createElement('a'), d = new Date(), p = n => String(n).padStart(2, '0');
    a.href = URL.createObjectURL(b);
    a.download = `skp-watch-${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}.png`;
    a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  }, 'image/png');
}
document.getElementById('snap').onclick = () => { snapReq = true; };

load();
renderer.setAnimationLoop(now => { stepMove(now); if (!fp) controls.update();   // in first person OrbitControls would re-aim the camera at its target
   if (!rtFrame()) { if (ao.on && ao.composer) ao.composer.render(); else renderer.render(scene, camera); }
   if (snapReq) { snapReq = false; snapshot(); }
   placeLabels(); });
</script>
</body>
</html>
